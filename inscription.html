<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Atlas Dev Days</title>
        <link rel="icon" type="image/png" href="images/jbell.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <!-- Top Navigation Bar -->
        <nav class="navbar">
            <div class="brand">
                <span class="brand-text">atlas dev days</span>
                        <img src="images/jbell.png" alt="Logo Atlas Dev Days" class="brand-icon-img">
            </div>

            <div class="nav-right">
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">accueil</a></li>
                    <li class="separator">|</li>
                    <li><a href="programme.html" class="nav-link">programme</a></li>
                    <li class="separator">|</li>
                    <li><a href="intervenants.html" class="nav-link">intervenants</a></li>
                </ul>
                <a href="inscription.html" class="btn-subscribe">S'INSCRIRE</a>
            </div>
        </nav>

        <!-- Main Registration Form Card -->
        <main class="hero-content">
            <div class="card form-card">
                <p class="date">22-23 octobre 2026. marrakesh</p>
                <h1 class="form-title">Inscription</h1>

                <form action="#" method="POST" class="registration-form">
                    
                    <!-- Full Name Field -->
                    <div class="form-group">
                        <label for="fullname">Nom complet</label>
                        <input type="text" id="fullname" name="fullname" placeholder="ex: Jean Dupont" required>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email">Adresse Email</label>
                        <input type="email" id="email" name="email" placeholder="jean.dupont@email.com" required>
                    </div>

                    <!-- Phone Number Field -->
                    <div class="form-group">
                        <label for="phone">Numéro de téléphone</label>
                        <input type="tel" id="phone" name="phone" placeholder="+212" required>
                    </div>

                    <!-- Attendance Choice (Jeudi / Vendredi / Les deux) -->
                    <div class="form-group">
                        <label>Présence souhaitée</label>
                        <div class="day-selector">
                            <label class="radio-card">
                                <input type="radio" name="attendance" value="jeudi" required>
                                <span class="radio-content">
                                    <strong>Jeudi</strong>
                                    <small>22 Oct</small>
                                </span>
                            </label>

                            <label class="radio-card">
                                <input type="radio" name="attendance" value="vendredi">
                                <span class="radio-content">
                                    <strong>Vendredi</strong>
                                    <small>23 Oct</small>
                                </span>
                            </label>

                            <label class="radio-card">
                                <input type="radio" name="attendance" value="both" checked>
                                <span class="radio-content">
                                    <strong>Les 2 jours</strong>
                                    <small>22 & 23 Oct</small>
                                </span>
                            </label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn submit-btn">Je m'inscris</button>

                </form>
            </div>
        </main>
    </header>

</body>
</html>
